[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "Snowball"
dynamic = ["version"]
description = "Investment strategy backtesting tool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hong Junhyoung", email = "bellus77@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.3",
    "pandas>=1.3.5",
    "scipy>=1.7.3",
    "tqdm>=4.45.0",
    "plotly>=5.1.0",
    "ipython",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/HongJunhyoung/snowball"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # plotly 5.1 (oldest supported) uses deprecated stdlib APIs internally
    "ignore::DeprecationWarning:plotly.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.tox]
requires = ["tox>=4.21", "tox-uv>=1"]
env_list = ["lint", "py310-pandas1", "py313-pandas2", "py313-pandas3"]

[tool.tox.env_run_base]
package = "wheel"
wheel_build_env = ".pkg"
set_env = { UV_NO_BUILD = "1" }
deps = ["pytest", "jinja2"]
commands = [["pytest", "tests", { replace = "posargs", extend = true }]]

# pandas1: oldest supported versions; pandas2/pandas3: latest of each major with latest deps
[tool.tox.env.py310-pandas1]
base_python = ["python3.10"]
deps = [
    { replace = "ref", of = ["tool", "tox", "env_run_base", "deps"], extend = true },
    "numpy==1.21.3",
    "pandas==1.3.5",
    "scipy==1.7.3",
    "plotly==5.1.0",
    "tqdm==4.45.0",
]

[tool.tox.env.py313-pandas2]
base_python = ["python3.13"]
deps = [
    { replace = "ref", of = ["tool", "tox", "env_run_base", "deps"], extend = true },
    "pandas>=2,<3",
]

[tool.tox.env.lint]
skip_install = true
deps = ["ruff"]
commands = [["ruff", "check", "src", "tests"], ["ruff", "format", "--check", "src", "tests"]]

[tool.tox.env.py313-pandas3]
base_python = ["python3.13"]
deps = [
    { replace = "ref", of = ["tool", "tox", "env_run_base", "deps"], extend = true },
    "pandas>=3,<4",
]
